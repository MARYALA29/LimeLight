name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# pull-requests: write is needed by the coverage-comment step below to post
# the coverage summary on PRs. contents stays read-only.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    env:
      # prisma generate (postinstall) needs DATABASE_URL to be set, but
      # never connects — a dummy URL is sufficient for build-time work.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/limelight_ci
      JWT_SECRET: ci-secret-not-used-anywhere

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Runs jest with --coverage; the coverageThreshold configured in
      # jest.config.js will fail this step if total line/branch/function/
      # statement coverage drops below the floor. This is the gate.
      - name: Test (with coverage)
        run: npm run test:coverage -- --ci

      # Posts/updates a single PR comment summarising total coverage and
      # per-file deltas vs the base. Only runs on pull_request events; the
      # action is a no-op on push to main. Failure here must not fail CI —
      # the gate above is the source of truth.
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1.0.27
        continue-on-error: true
        with:
          coverage-summary-path: ./coverage/coverage-summary.json
          title: Coverage report
          summary-title: Total coverage
          badge-title: coverage
          hide-comment: false
          create-new-comment: false
          remove-links-to-files: false
          remove-links-to-lines: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    env:
      # prisma generate (postinstall) needs DATABASE_URL to be set, but
      # never connects — a dummy URL is sufficient.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/limelight_ci
      JWT_SECRET: ci-secret-not-used-anywhere
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fail on any high/critical vulnerability that is not explicitly
      # allowlisted in audit-ci.jsonc. Each allowlisted advisory has a
      # reason and is tracked for cleanup.
      - name: Audit dependencies
        run: npx audit-ci --config audit-ci.jsonc
